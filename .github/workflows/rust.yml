name: Rust

on:
  pull_request:
  push:
    branches: [master]
  # To run the checks on any branch by hand
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Jobs may only read the repository, unless one asks for more itself
permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

      # iroh is also built as a cdylib, which in debug mode exports more
      # symbols than a Windows DLL can hold
      - name: Tests (release)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --release

  musl:
    name: Static Linux build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked -p qs-cli --target x86_64-unknown-linux-musl

      - name: Check that the binary is static
        run: file target/x86_64-unknown-linux-musl/debug/qsend | grep -q "static"

  worker:
    name: Rendezvous Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install wrangler
        working-directory: rendezvous-worker
        run: npm ci

      # The Worker runs on this machine, nothing is deployed
      - name: Run the server tests against the Worker
        working-directory: rendezvous-worker
        run: ./test.sh

  nix:
    name: Nix flake
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      # Builds the package, which runs the tests of the workspace inside the Nix sandbox
      - name: Check the flake
        run: nix flake check -L

      - name: Run what was built
        run: |
          nix run . -- --version
          nix develop -c cargo --version
