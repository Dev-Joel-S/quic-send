name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# TODO: this workflow has never run. Start it once by hand (workflow_dispatch) and check
#       that the MSVC build, `cargo deb` and the artifacts work before tagging a release.

# Jobs may only read the repository, unless one asks for more itself
permissions:
  contents: read

jobs:
  linux:
    name: Linux (static musl, .deb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools and cargo-deb
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cargo-deb --locked --version 3.8.0

      - name: Build
        run: cargo build --release --locked -p qs-cli -p qs-rendezvous --target x86_64-unknown-linux-musl

      - name: Package
        shell: bash
        run: |
          version=$(cargo pkgid -p qs-cli | sed 's/.*[#@]//')
          mkdir -p dist "qsend-$version-x86_64-linux"
          cp target/x86_64-unknown-linux-musl/release/{qsend,qs-rendezvous} README.md LICENSE "qsend-$version-x86_64-linux/"
          cp packaging/qs-rendezvous.service "qsend-$version-x86_64-linux/"
          tar czf "dist/qsend-$version-x86_64-linux.tar.gz" "qsend-$version-x86_64-linux"
          cargo deb -p qs-cli --target x86_64-unknown-linux-musl --no-build --output dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build
        run: cargo build --release --locked -p qs-cli --target x86_64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          version=$(cargo pkgid -p qs-cli | sed 's/.*[#@]//')
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/qsend.exe "dist/qsend-$version-x86_64-windows.exe"
          7z a "dist/qsend-$version-x86_64-windows.zip" ./target/x86_64-pc-windows-msvc/release/qsend.exe README.md LICENSE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*

  release:
    name: Publish release
    needs: [linux, windows]
    # A manual run only builds, there is no tag to release then
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
