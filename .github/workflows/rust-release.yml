name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# TODO: this workflow has never run. Start it once by hand (workflow_dispatch) and check
#       that the MSVC build, `cargo deb` and the artifacts work before tagging a release.

jobs:
  linux:
    name: Linux (static musl, .deb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools and cargo-deb
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cargo-deb --locked

      - name: Build
        run: cargo build --release --locked -p qs-cli --target x86_64-unknown-linux-musl

      - name: Package
        shell: bash
        run: |
          version=$(cargo pkgid -p qs-cli | sed 's/.*[#@]//')
          mkdir -p dist "qs-$version-x86_64-linux"
          cp target/x86_64-unknown-linux-musl/release/qs README.md LICENSE "qs-$version-x86_64-linux/"
          tar czf "dist/qs-$version-x86_64-linux.tar.gz" "qs-$version-x86_64-linux"
          cargo deb -p qs-cli --target x86_64-unknown-linux-musl --no-build --output dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked -p qs-cli --target x86_64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          version=$(cargo pkgid -p qs-cli | sed 's/.*[#@]//')
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/qs.exe "dist/qs-$version-x86_64-windows.exe"
          7z a "dist/qs-$version-x86_64-windows.zip" ./target/x86_64-pc-windows-msvc/release/qs.exe README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    name: Publish release
    needs: [linux, windows]
    # A manual run only builds, there is no tag to release then
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
