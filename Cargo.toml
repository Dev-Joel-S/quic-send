[workspace]
members = [
    "qs-core",
    "qs-cli",
]

resolver = "2"

[workspace.dependencies]
qs-core = { path = "./qs-core", version = "0.5.0" }

iroh = "1.3"
postcard = { version = "1.1", features = ["use-std"] }
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "net",
    "fs",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
pretty_assertions = "1.4.1"
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
async-compression = { version = "0.4.50", features = ["tokio", "gzip"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
