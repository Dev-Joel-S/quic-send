[package]
name = "qs-core"
version = "0.5.0"
edition = "2021"
authors = ["Maxomatic458"]
description = "quic send core library"
repository = "https://github.com/dev-joel-s/quic-send"
readme = "../README.md"
license = "MIT"
keywords = ["quic", "file-transfer", "peer-to-peer"]

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
iroh = { workspace = true }
noq = { workspace = true }
rustls = { workspace = true }
aws-lc-rs = { workspace = true }
pake-cpace = { workspace = true }
libcrux-ml-kem = { workspace = true }
zeroize = { workspace = true }
unicode-normalization = { workspace = true }
reqwest = { workspace = true }
qs-rendezvous-api = { workspace = true }
async-compression = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
fs4 = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
qs-rendezvous = { path = "../qs-rendezvous" }
axum = "0.8"
