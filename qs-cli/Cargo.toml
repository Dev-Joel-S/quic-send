[package]
name = "qs-cli"
version = "0.5.0"
description = "A quic based peer-to-peer file transfer tool"
authors = ["Maxomatic458"]
edition = "2021"
repository = "https://github.com/dev-joel-s/quic-send"
readme = "../README.md"
license = "MIT"
keywords = ["quic", "file-transfer", "peer-to-peer"]

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
iroh = { workspace = true }
postcard = { workspace = true }
base64 = { workspace = true }
qs-core = { workspace = true }

clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
dialoguer = "0.12"
colored = "3.1"
color-eyre = "0.6.5"
dirs = "7"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"

[[bin]]
path = "src/main.rs"
name = "qs"

[package.metadata.deb]
name = "quic-send"
maintainer = "Joel Summa <74009152+Dev-Joel-S@users.noreply.github.com>"
copyright = "2024 Maxomatic458, 2026 Joel Summa"
license-file = ["../LICENSE", "0"]
extended-description = """\
Peer-to-peer file transfer over QUIC. Files and folders are sent over a \
direct, encrypted connection, interrupted transfers are resumed."""
section = "net"
priority = "optional"
# The release binary is statically linked against musl
depends = ""
assets = [
    ["target/release/qs", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/quic-send/README.md", "644"],
]
