[package]
name = "qs-cli"
version = "0.5.0"
description = "A quic based peer-to-peer file transfer tool"
authors = ["Maxomatic458"]
edition = "2021"
repository = "https://github.com/dev-joel-s/quic-send"
readme = "../README.md"
license = "MIT"
keywords = ["quic", "file-transfer", "peer-to-peer"]

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
iroh = { workspace = true }
postcard = { workspace = true }
base64 = { workspace = true }
qs-core = { workspace = true }

clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
dialoguer = "0.12"
colored = "3.1"
color-eyre = "0.6.5"
dirs = "7"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[[bin]]
path = "src/main.rs"
name = "qs"
