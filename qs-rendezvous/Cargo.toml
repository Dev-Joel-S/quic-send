[package]
name = "qs-rendezvous"
version = "0.5.0"
edition = "2021"
description = "Rendezvous server for quic-send, an untrusted mailbox for pairing"
repository = "https://github.com/dev-joel-s/quic-send"
license = "MIT"
publish = false

[dependencies]
qs-rendezvous-api = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync"] }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"

[dev-dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }

[[bin]]
path = "src/main.rs"
name = "qs-rendezvous"

